services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - arcad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    volumes:
      - arcad_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ACTIVE_SLOT: ${ACTIVE_SLOT}
      INACTIVE_SLOT: ${INACTIVE_SLOT}
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    command: >
      /bin/sh -c "envsubst '$$ACTIVE_SLOT $$INACTIVE_SLOT' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${TEST_HTTP_PORT:-8082}:8082"
    depends_on:
      api-blue:
        condition: service_started
      api-green:
        condition: service_started
      frontend-blue:
        condition: service_started
      frontend-green:
        condition: service_started

  api-blue:
    image: ${API_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    environment:
      APP_SLOT: blue
      DATABASE_URL: ${BLUE_DATABASE_URL}
      PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${SECRET_KEY}
      API_PREFIX: ${API_PREFIX}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 20s
      timeout: 5s
      retries: 5

  api-green:
    image: ${API_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    environment:
      APP_SLOT: green
      DATABASE_URL: ${GREEN_DATABASE_URL}
      PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECRET_KEY: ${SECRET_KEY}
      API_PREFIX: ${API_PREFIX}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend-blue:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_SLOT: blue
    expose:
      - "80"

  frontend-green:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_SLOT: green
    expose:
      - "80"

volumes:
  arcad_pgdata:
  arcad_pgdata_test:
