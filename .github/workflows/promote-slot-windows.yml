name: Promote Blue Green Slot (Windows)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Slot to promote
        required: true
        type: choice
        options:
          - blue
          - green

jobs:
  promote:
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Promote slot locally on Windows runner
        shell: pwsh
        run: |
          & "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\scripts\promote_slot.ps1" -RootDir "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}" -TargetSlot "${{ inputs.slot }}"
