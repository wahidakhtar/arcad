name: Promote Blue Green Slot (Windows)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Slot to promote
        required: true
        type: choice
        options:
          - blue
          - green

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INTERNAL_SERVER_HOST }}
          username: ${{ secrets.INTERNAL_SERVER_USER }}
          key: ${{ secrets.INTERNAL_SERVER_SSH_KEY }}
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -File "C:\arcad-bluegreen\scripts\promote_slot.ps1" -RootDir "C:\arcad-bluegreen" -TargetSlot ${{ inputs.slot }}
