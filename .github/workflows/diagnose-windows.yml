name: Diagnose Server State (Windows)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Check state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "=== .env ==="
          Get-Content "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\.env"
          Write-Output ""
          Write-Output "=== Running containers ==="
          docker ps --format "table {{.Names}}`t{{.Image}}`t{{.Status}}`t{{.Ports}}"
          Write-Output ""
          Write-Output "=== API green logs ==="
          docker logs arcad-bluegreen-api-green-1 --tail 80 2>&1
          Write-Output ""
          Write-Output "=== API blue logs ==="
          docker logs arcad-bluegreen-api-blue-1 --tail 80 2>&1
          Write-Output ""
          Write-Output "=== Frontend green logs ==="
          docker logs arcad-bluegreen-frontend-green-1 --tail 40 2>&1
          Write-Output ""
          Write-Output "=== Frontend blue logs ==="
          docker logs arcad-bluegreen-frontend-blue-1 --tail 40 2>&1
          Write-Output ""
          Write-Output "=== Restarting all containers ==="
          Set-Location "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}"
          docker compose -f docker-compose.yml up -d --force-recreate
          Write-Output "Done"
