name: Diagnose Server State (Windows)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Check state
        shell: powershell
        run: |
          Write-Output "=== .env ==="
          Get-Content "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\.env"
          Write-Output ""
          Write-Output "=== Running containers ==="
          docker ps --format "table {{.Names}}`t{{.Image}}`t{{.Status}}`t{{.Ports}}"
          Write-Output ""
          Write-Output "=== API green logs ==="
          docker logs arcad-bluegreen-api-green-1 --tail 60 2>&1
          Write-Output ""
          Write-Output "=== API blue logs ==="
          docker logs arcad-bluegreen-api-blue-1 --tail 60 2>&1
          Write-Output ""
          Write-Output "=== Restarting proxy to fix DNS cache ==="
          Set-Location "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}"
          docker compose -f docker-compose.yml up -d --force-recreate --no-deps proxy
          Write-Output "Proxy restarted"
