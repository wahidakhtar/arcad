name: Diagnose Server State (Windows)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Check state
        shell: powershell
        run: |
          Write-Output "=== .env ==="
          Get-Content "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\.env"
          Write-Output ""
          Write-Output "=== Running containers ==="
          docker ps --format "table {{.Names}}`t{{.Image}}`t{{.Status}}`t{{.Ports}}"
          Write-Output ""
          Write-Output "=== Proxy logs (last 30) ==="
          docker logs --tail 30 arcad-bluegreen-proxy-1 2>&1
          Write-Output ""
          Write-Output "=== Proxy nginx config ==="
          docker exec arcad-bluegreen-proxy-1 cat /etc/nginx/conf.d/default.conf 2>&1
          Write-Output ""
          Write-Output "=== api-blue logs (last 10) ==="
          docker logs --tail 10 arcad-bluegreen-api-blue-1 2>&1
