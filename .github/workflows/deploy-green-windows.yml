name: Deploy Inactive Slot (Windows)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arcad-api:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arcad-api:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/arcad-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/arcad-api:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/windows/frontend.Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arcad-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/arcad-frontend:cache,mode=max
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ghcr.io/${{ github.repository_owner }}/arcad-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/arcad-frontend:latest

  deploy-inactive:
    needs: build-images
    runs-on:
      - self-hosted
      - windows
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy files to server root
        shell: powershell
        run: |
          Copy-Item -Path "deploy\windows\docker-compose.yml" -Destination "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\docker-compose.yml" -Force
          Copy-Item -Path "deploy\windows\proxy\default.conf.template" -Destination "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\proxy\default.conf.template" -Force
          Copy-Item -Path "deploy\windows\scripts\deploy_inactive.ps1" -Destination "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\scripts\deploy_inactive.ps1" -Force
          Copy-Item -Path "deploy\windows\scripts\promote_slot.ps1" -Destination "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}\scripts\promote_slot.ps1" -Force

      - name: Deploy inactive slot locally on Windows runner
        shell: powershell
        run: |
          Set-Location "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}"
          docker login ghcr.io -u "${{ github.repository_owner }}" -p "${{ secrets.GHCR_READ_TOKEN }}"
          .\scripts\deploy_inactive.ps1 -RootDir "${{ secrets.INTERNAL_SERVER_DEPLOY_ROOT }}" -ImageTag "${{ github.sha }}"
